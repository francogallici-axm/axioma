<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel de Axioma Consulting</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Estilos propios del panel: reutilizan las variables de marca de styles.css */
    body { min-height: 100vh; padding: 0 0 80px; }
    .admin-header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
      padding: 18px 28px;
      background: rgba(7, 37, 40, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(232, 220, 200, 0.1);
    }
    .admin-header h1 { font-size: 1.15rem; color: var(--white); }
    .admin-user { font-size: 0.85rem; color: var(--cream); opacity: 0.8; }
    .admin-actions { display: flex; align-items: center; gap: 14px; }
    .admin-actions a { font-size: 0.9rem; color: var(--teal); }
    .admin-main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 0; }
    .admin-status {
      margin-bottom: 24px; padding: 12px 16px; border-radius: 4px;
      font-size: 0.92rem; display: none;
    }
    .admin-status.show { display: block; }
    .admin-status.ok { background: rgba(126, 176, 177, 0.15); color: var(--teal); border: 1px solid rgba(126,176,177,0.4); }
    .admin-status.error { background: rgba(200, 90, 90, 0.15); color: #e6a2a2; border: 1px solid rgba(200,90,90,0.4); }
    .admin-section { margin-bottom: 28px; }
    .admin-section h2 {
      font-family: var(--font-sans); font-size: 0.8rem; text-transform: uppercase;
      letter-spacing: 2px; color: var(--teal); margin-bottom: 18px;
      padding-bottom: 10px; border-bottom: 1px solid rgba(232,220,200,0.12);
    }

    /* Tarjetas del dashboard de edición */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      align-items: start;
    }
    .admin-card {
      background: rgba(7, 37, 40, 0.55);
      border: 1px solid rgba(232, 220, 200, 0.1);
      border-radius: 6px;
      padding: 22px 22px 6px;
    }
    .admin-card > h2 { margin-top: 0; }
    /* Los campos cortos conviven de a dos dentro de una tarjeta */
    .admin-card-fields {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0 20px;
    }
    .admin-field--wide { grid-column: 1 / -1; }

    .admin-field { margin-bottom: 18px; }
    .admin-field label { display: block; font-size: 0.85rem; color: var(--cream); margin-bottom: 6px; }
    .admin-field input[type="text"], .admin-field textarea {
      width: 100%; font-family: var(--font-sans); font-size: 0.95rem; color: var(--white);
      background: var(--green-dark); border: 1px solid rgba(232,220,200,0.18);
      border-radius: 3px; padding: 11px 13px; resize: vertical;
    }
    .admin-field input[type="text"]:focus, .admin-field textarea:focus {
      outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(126,176,177,0.15);
    }
    .admin-save-bar {
      position: sticky; bottom: 0; margin-top: 8px; padding: 18px 24px;
      background: rgba(7, 37, 40, 0.96); backdrop-filter: blur(8px);
      border-top: 1px solid rgba(232,220,200,0.1);
      display: flex; align-items: center; gap: 16px;
    }
    .admin-save-bar .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .admin-loading { padding: 60px 0; text-align: center; color: var(--cream); opacity: 0.7; }

    /* ---------- Estadísticas ---------- */
    .stats-grid { display: flex; flex-wrap: wrap; gap: 32px; margin-bottom: 22px; }
    .stat-box .stat-number { font-family: var(--font-serif); font-size: 2.4rem; color: var(--white); line-height: 1; }
    .stat-box .stat-label { font-size: 0.8rem; color: var(--cream); opacity: 0.75; margin-top: 6px; }
    .stats-pages { list-style: none; }
    .stats-pages li {
      display: flex; justify-content: space-between; gap: 16px;
      padding: 9px 0; font-size: 0.9rem;
      border-bottom: 1px solid rgba(232,220,200,0.08);
    }
    .stats-pages li span:first-child { color: var(--cream); }
    .stats-pages li span:last-child { color: var(--white); font-variant-numeric: tabular-nums; }
    .stats-empty { font-size: 0.9rem; color: var(--cream); opacity: 0.65; }

    /* ---------- Navegación por pestañas ---------- */
    .admin-nav {
      display: flex;
      gap: 4px;
      padding: 0 28px;
      background: rgba(7, 37, 40, 0.96);
      border-bottom: 1px solid rgba(232, 220, 200, 0.1);
      position: sticky;
      top: 62px;
      z-index: 9;
    }
    .admin-nav button {
      font-family: var(--font-sans);
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.6);
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 14px 18px;
      cursor: pointer;
      transition: color .2s ease, border-color .2s ease;
    }
    .admin-nav button:hover { color: var(--white); }
    .admin-nav button[aria-selected="true"] {
      color: var(--teal);
      border-bottom-color: var(--teal);
    }
    .admin-page[hidden] { display: none; }
    .admin-page-intro {
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 28px;
    }

    /* ---------- FAQs dinámicas ---------- */
    .faq-editor-item {
      background: var(--green-deep);
      border: 1px solid rgba(232, 220, 200, 0.12);
      border-radius: 5px;
      padding: 18px 18px 4px;
      margin-bottom: 16px;
      position: relative;
    }
    .faq-editor-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 12px;
    }
    .faq-editor-num {
      font-size: 0.75rem; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--teal);
    }
    .faq-editor-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: none; border: 1px solid rgba(232, 220, 200, 0.2);
      color: var(--cream); border-radius: 4px;
      width: 30px; height: 28px; cursor: pointer; font-size: 0.9rem;
      display: grid; place-items: center;
      transition: border-color .2s ease, color .2s ease, background-color .2s ease;
    }
    .icon-btn:hover:not(:disabled) { border-color: var(--teal); color: var(--teal); }
    .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .icon-btn--danger:hover { border-color: #c96b6b; color: #e6a2a2; }
    .btn-add {
      background: none;
      border: 1px dashed rgba(126, 176, 177, 0.5);
      color: var(--teal);
      border-radius: 5px;
      padding: 13px 20px;
      width: 100%;
      font-family: var(--font-sans);
      font-size: 0.92rem;
      cursor: pointer;
      transition: background-color .2s ease, border-color .2s ease;
    }
    .btn-add:hover { background: rgba(126, 176, 177, 0.08); border-style: solid; }
    .btn-add:disabled { opacity: 0.4; cursor: not-allowed; }
    .faq-limit-note {
      font-size: 0.8rem; color: rgba(255,255,255,0.5);
      margin-top: 10px; text-align: center;
    }

    /* ---------- Dashboard en dos columnas ---------- */
    @media (min-width: 900px) {
      .admin-grid { grid-template-columns: 1fr 1fr; }
      /* Las secciones con textos largos ocupan el ancho completo */
      .admin-card--full { grid-column: 1 / -1; }
      .admin-card--full .admin-card-fields { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <h1>Panel de Axioma Consulting</h1>
    <div class="admin-actions">
      <span class="admin-user" id="adminUser"></span>
      <a href="/" target="_blank" rel="noopener">Ver sitio ↗</a>
    </div>
  </header>

  <nav class="admin-nav" role="tablist" aria-label="Secciones del panel">
    <button type="button" role="tab" id="tabContenido" aria-selected="true" aria-controls="pageContenido">Contenido</button>
    <button type="button" role="tab" id="tabReportes" aria-selected="false" aria-controls="pageReportes">Reportes</button>
  </nav>

  <main class="admin-main">
    <div class="admin-status" id="statusBox"></div>

    <!-- ---------- Página: Contenido ---------- -->
    <section class="admin-page" id="pageContenido" role="tabpanel" aria-labelledby="tabContenido">
      <p class="admin-page-intro">
        Editá los textos de la landing. Los cambios se publican al instante.
      </p>
      <div class="admin-loading" id="loading">Cargando contenido…</div>
      <form id="contentForm" hidden></form>

      <div class="admin-card admin-card--full" id="faqCard" hidden>
        <h2>Preguntas frecuentes</h2>
        <div id="faqEditor"></div>
        <button type="button" class="btn-add" id="faqAddBtn">+ Agregar pregunta</button>
        <p class="faq-limit-note" id="faqCount"></p>
      </div>
    </section>

    <!-- ---------- Página: Reportes ---------- -->
    <section class="admin-page" id="pageReportes" role="tabpanel" aria-labelledby="tabReportes" hidden>
      <p class="admin-page-intro">
        Actividad del sitio web.
      </p>
      <div class="admin-section">
        <h2>Estadísticas</h2>
        <div id="statsBody" class="stats-empty">Cargando estadísticas…</div>
      </div>
    </section>
  </main>

  <div class="admin-save-bar" id="saveBar" hidden>
    <button type="submit" form="contentForm" class="btn btn-primary" id="saveBtn">Guardar cambios</button>
    <span class="admin-user" id="saveHint">Los cambios se publican al instante en el sitio.</span>
  </div>

  <script>
    // Mismo esquema que src/content.js — si se agrega un campo nuevo ahí,
    // agregarlo también acá para que aparezca en el panel.
    const SCHEMA = [
      { section: "Hero", fields: [
        { key: "hero.eyebrow", label: "Texto pequeño superior", type: "text" },
        { key: "hero.pillar1", label: "Pilar 1", type: "text" },
        { key: "hero.pillar2", label: "Pilar 2", type: "text" },
        { key: "hero.pillar3", label: "Pilar 3", type: "text" },
        { key: "hero.subtitle", label: "Subtítulo", type: "textarea" },
        { key: "hero.lead1", label: "Bajada, párrafo 1", type: "textarea" },
        { key: "hero.lead2", label: "Bajada, párrafo 2", type: "textarea" },
        { key: "hero.cta", label: "Texto del botón principal", type: "text" },
      ]},
      { section: "Quiénes somos", fields: [
        { key: "quienes.kicker", label: "Etiqueta de sección", type: "text" },
        { key: "quienes.title", label: "Título", type: "text" },
        { key: "quienes.p1", label: "Párrafo 1", type: "textarea" },
        { key: "quienes.highlight", label: "Frase destacada", type: "textarea" },
        { key: "quienes.p2", label: "Párrafo 2", type: "textarea" },
        { key: "card1.title", label: "Tarjeta 1 · título", type: "text" },
        { key: "card1.desc", label: "Tarjeta 1 · descripción", type: "textarea" },
        { key: "card2.title", label: "Tarjeta 2 · título", type: "text" },
        { key: "card2.desc", label: "Tarjeta 2 · descripción", type: "textarea" },
        { key: "card3.title", label: "Tarjeta 3 · título", type: "text" },
        { key: "card3.desc", label: "Tarjeta 3 · descripción", type: "textarea" },
      ]},
      { section: "Calculadora de ahorro", fields: [
        { key: "calc.kicker", label: "Etiqueta de sección", type: "text" },
        { key: "calc.title", label: "Título", type: "text" },
        { key: "calc.intro", label: "Texto de introducción", type: "textarea" },
      ]},
      { section: "Preguntas frecuentes · encabezado", fields: [
        { key: "faq.kicker", label: "Etiqueta de sección", type: "text" },
        { key: "faq.title", label: "Título", type: "text" },
      ]},
      { section: "Contacto", fields: [
        { key: "contacto.kicker", label: "Etiqueta de sección", type: "text" },
        { key: "contacto.title", label: "Título", type: "text" },
        { key: "contacto.intro", label: "Texto de introducción", type: "textarea" },
        { key: "contacto.formSubmit", label: "Texto del botón de envío", type: "text" },
      ]},
      { section: "Footer", fields: [
        { key: "footer.copyright", label: "Texto de copyright", type: "text" },
      ]},
    ];

    const form = document.getElementById("contentForm");
    const loading = document.getElementById("loading");
    const statusBox = document.getElementById("statusBox");
    const saveBar = document.getElementById("saveBar");
    const saveBtn = document.getElementById("saveBtn");
    const adminUser = document.getElementById("adminUser");

    function showStatus(message, kind) {
      statusBox.textContent = message;
      statusBox.className = "admin-status show " + kind;
    }

    function buildForm(content) {
      const grid = document.createElement("div");
      grid.className = "admin-grid";

      SCHEMA.forEach(function (group) {
        const card = document.createElement("div");
        card.className = "admin-card";
        // Las secciones con muchos campos ocupan las dos columnas.
        if (group.fields.length > 4) card.classList.add("admin-card--full");

        const h2 = document.createElement("h2");
        h2.textContent = group.section;
        card.appendChild(h2);

        const fields = document.createElement("div");
        fields.className = "admin-card-fields";

        group.fields.forEach(function (field) {
          const wrap = document.createElement("div");
          wrap.className = "admin-field";
          // Los textos largos ocupan toda la fila para poder leerlos bien.
          if (field.type === "textarea") wrap.classList.add("admin-field--wide");

          const label = document.createElement("label");
          label.setAttribute("for", field.key);
          label.textContent = field.label;
          wrap.appendChild(label);

          const input = document.createElement(field.type === "textarea" ? "textarea" : "input");
          if (field.type !== "textarea") input.type = "text";
          else input.rows = 3;
          input.id = field.key;
          input.name = field.key;
          input.value = content[field.key] || "";
          wrap.appendChild(input);

          fields.appendChild(wrap);
        });

        card.appendChild(fields);
        grid.appendChild(card);
      });

      form.appendChild(grid);

      loading.hidden = true;
      form.hidden = false;
      // Solo mostramos la barra de guardado si el usuario está parado en la
      // pestaña de contenido (puede haber cambiado a Reportes mientras cargaba).
      saveBar.hidden = document.getElementById("pageContenido").hidden;
    }

    async function loadIdentity() {
      try {
        const res = await fetch("/cdn-cgi/access/get-identity", { credentials: "include" });
        if (!res.ok) return;
        const identity = await res.json();
        if (identity && identity.email) {
          adminUser.textContent = "Conectado como " + identity.email;
        }
      } catch {
        // En desarrollo local sin Cloudflare Access no hay identidad disponible.
      }
    }

    async function loadContent() {
      const res = await fetch("/admin/api/content");
      if (!res.ok) throw new Error("No se pudo cargar el contenido");
      return res.json();
    }

    /* ---------- Editor de preguntas frecuentes (lista dinámica) ---------- */
    const MAX_FAQ = 20;
    const faqEditor = document.getElementById("faqEditor");
    const faqCard = document.getElementById("faqCard");
    const faqAddBtn = document.getElementById("faqAddBtn");
    const faqCount = document.getElementById("faqCount");
    let faqItems = [];

    function renderFaq() {
      faqEditor.innerHTML = "";

      faqItems.forEach(function (item, index) {
        const box = document.createElement("div");
        box.className = "faq-editor-item";

        const head = document.createElement("div");
        head.className = "faq-editor-head";

        const num = document.createElement("span");
        num.className = "faq-editor-num";
        num.textContent = "Pregunta " + (index + 1);
        head.appendChild(num);

        const actions = document.createElement("div");
        actions.className = "faq-editor-actions";

        function boton(texto, titulo, alClickear, deshabilitado, esPeligro) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "icon-btn" + (esPeligro ? " icon-btn--danger" : "");
          b.textContent = texto;
          b.title = titulo;
          b.setAttribute("aria-label", titulo);
          b.disabled = !!deshabilitado;
          b.addEventListener("click", alClickear);
          return b;
        }

        actions.appendChild(boton("↑", "Subir", function () {
          const tmp = faqItems[index - 1];
          faqItems[index - 1] = faqItems[index];
          faqItems[index] = tmp;
          renderFaq();
        }, index === 0));

        actions.appendChild(boton("↓", "Bajar", function () {
          const tmp = faqItems[index + 1];
          faqItems[index + 1] = faqItems[index];
          faqItems[index] = tmp;
          renderFaq();
        }, index === faqItems.length - 1));

        actions.appendChild(boton("✕", "Eliminar esta pregunta", function () {
          if (!confirm("¿Eliminar la pregunta " + (index + 1) + "?")) return;
          faqItems.splice(index, 1);
          renderFaq();
        }, false, true));

        head.appendChild(actions);
        box.appendChild(head);

        const wrapQ = document.createElement("div");
        wrapQ.className = "admin-field";
        const labelQ = document.createElement("label");
        labelQ.textContent = "Pregunta";
        const inputQ = document.createElement("input");
        inputQ.type = "text";
        inputQ.value = item.q;
        inputQ.addEventListener("input", function () { faqItems[index].q = inputQ.value; });
        wrapQ.appendChild(labelQ);
        wrapQ.appendChild(inputQ);
        box.appendChild(wrapQ);

        const wrapA = document.createElement("div");
        wrapA.className = "admin-field";
        const labelA = document.createElement("label");
        labelA.textContent = "Respuesta";
        const inputA = document.createElement("textarea");
        inputA.rows = 3;
        inputA.value = item.a;
        inputA.addEventListener("input", function () { faqItems[index].a = inputA.value; });
        wrapA.appendChild(labelA);
        wrapA.appendChild(inputA);
        box.appendChild(wrapA);

        faqEditor.appendChild(box);
      });

      faqAddBtn.disabled = faqItems.length >= MAX_FAQ;
      faqCount.textContent =
        faqItems.length + " de " + MAX_FAQ + " preguntas" +
        (faqItems.length >= MAX_FAQ ? " · llegaste al máximo" : "");
    }

    faqAddBtn.addEventListener("click", function () {
      if (faqItems.length >= MAX_FAQ) return;
      faqItems.push({ q: "", a: "" });
      renderFaq();
      // Foco en la pregunta recién agregada
      const inputs = faqEditor.querySelectorAll('.faq-editor-item input[type="text"]');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });

    async function loadFaq() {
      const res = await fetch("/admin/api/faq");
      if (!res.ok) throw new Error("No se pudieron cargar las preguntas");
      faqItems = await res.json();
      renderFaq();
      faqCard.hidden = false;
    }

    async function loadAnalytics() {
      const statsBody = document.getElementById("statsBody");
      try {
        const res = await fetch("/admin/api/analytics");
        const data = res.ok ? await res.json() : null;

        if (!data) {
          statsBody.className = "stats-empty";
          statsBody.textContent =
            "Estadísticas no disponibles todavía (falta configurar el acceso a Cloudflare Analytics, o el sitio todavía no tiene visitas registradas).";
          return;
        }

        statsBody.className = "";
        statsBody.innerHTML = "";

        const grid = document.createElement("div");
        grid.className = "stats-grid";
        const box = document.createElement("div");
        box.className = "stat-box";
        box.innerHTML =
          '<div class="stat-number">' + data.totalVisits + '</div>' +
          '<div class="stat-label">Visitas · últimos ' + data.windowDays + ' días</div>';
        grid.appendChild(box);
        statsBody.appendChild(grid);

        if (data.topPages && data.topPages.length) {
          const list = document.createElement("ul");
          list.className = "stats-pages";
          data.topPages.forEach(function (page) {
            const li = document.createElement("li");
            li.innerHTML =
              "<span>" + page.path + "</span><span>" + page.visits + "</span>";
            list.appendChild(li);
          });
          statsBody.appendChild(list);
        }
      } catch {
        statsBody.className = "stats-empty";
        statsBody.textContent = "No se pudieron cargar las estadísticas.";
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      saveBtn.disabled = true;
      saveBtn.textContent = "Guardando…";
      try {
        const data = {};
        SCHEMA.forEach(function (group) {
          group.fields.forEach(function (field) {
            data[field.key] = document.getElementById(field.key).value;
          });
        });
        // Descartamos preguntas incompletas antes de guardar.
        const faqLimpio = faqItems.filter(function (it) {
          return it.q.trim() && it.a.trim();
        });
        const descartadas = faqItems.length - faqLimpio.length;

        const [resContent, resFaq] = await Promise.all([
          fetch("/admin/api/content", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          }),
          fetch("/admin/api/faq", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(faqLimpio),
          }),
        ]);

        if (!resContent.ok) throw new Error("Error al guardar los textos (" + resContent.status + ")");
        if (!resFaq.ok) throw new Error("Error al guardar las preguntas (" + resFaq.status + ")");

        // Reflejamos en pantalla lo que realmente quedó guardado.
        faqItems = await resFaq.json();
        renderFaq();

        showStatus(
          "Cambios guardados. Ya están publicados en el sitio." +
            (descartadas > 0
              ? " Se omitieron " + descartadas + " pregunta(s) sin completar."
              : ""),
          "ok"
        );
      } catch (err) {
        showStatus("No se pudo guardar: " + err.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Guardar cambios";
      }
    });

    /* ---------- Navegación entre páginas del panel ---------- */
    (function initTabs() {
      var tabs = [
        { btn: document.getElementById("tabContenido"), page: document.getElementById("pageContenido") },
        { btn: document.getElementById("tabReportes"), page: document.getElementById("pageReportes") },
      ];

      function activar(indice) {
        tabs.forEach(function (t, i) {
          var activa = i === indice;
          t.btn.setAttribute("aria-selected", String(activa));
          t.page.hidden = !activa;
        });
        // La barra de guardado solo tiene sentido en la página de contenido,
        // y solo una vez que el formulario ya cargó.
        saveBar.hidden = indice !== 0 || form.hidden;
        statusBox.className = "admin-status";
      }

      tabs.forEach(function (t, i) {
        t.btn.addEventListener("click", function () { activar(i); });
      });
    })();

    loadIdentity();
    loadAnalytics();
    loadFaq().catch(function (err) {
      faqEditor.textContent = "Error al cargar las preguntas: " + err.message;
      faqCard.hidden = false;
    });
    loadContent()
      .then(buildForm)
      .catch(function (err) {
        loading.textContent = "Error al cargar el contenido: " + err.message;
      });
  </script>
</body>
</html>
